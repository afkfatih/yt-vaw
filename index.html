<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="YouTube videolarını WAV formatında indirin. Mobil uyumlu, hızlı ve güvenli.">
  <meta name="keywords" content="youtube, wav, indir, mp3, ses, video">
  <meta name="theme-color" content="#0d6efd">
  <title>YouTube'dan WAV İndir - GitHub Pages</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="icon-192x192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192x192.png">
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    .btn {
      -webkit-tap-highlight-color: rgba(0,0,0,0);
      touch-action: manipulation;
    }
    .form-control {
      font-size: 16px; /* Prevents zoom on iOS */
    }
    .loading {
      display: none;
    }
    .spinner-border-sm {
      width: 1rem;
      height: 1rem;
    }
    @media (max-width: 576px) {
      .container {
        padding-left: 15px;
        padding-right: 15px;
      }
      .card {
        margin: 10px;
        border-radius: 15px;
      }
      .btn {
        padding: 12px;
        font-size: 16px;
        border-radius: 10px;
      }
    }
  </style>
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title mb-4 text-center">YouTube'dan WAV İndir</h3>
            <form id="ytForm">
              <div class="mb-3">
                <label for="url" class="form-label">YouTube Linki</label>
                <input type="url" class="form-control" id="url" name="url" placeholder="https://www.youtube.com/watch?v=..." required autocomplete="off" autocapitalize="off" spellcheck="false">
              </div>
              <button type="submit" class="btn btn-primary w-100" id="submitBtn">
                <span class="btn-text">İndir</span>
                <span class="loading">
                  <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                  İşleniyor...
                </span>
              </button>
            </form>
            <div id="result" class="mt-4 text-center"></div>
          </div>
        </div>
        <p class="text-center mt-3 text-muted" style="font-size:0.9em;">Telif haklarına dikkat edin. Sadece izin verilen içerikleri indirin.</p>
      </div>
    </div>
  </div>
  <script>
    function getYouTubeVideoId(inputUrl) {
      try {
        const u = new URL(inputUrl);

        // youtu.be/<id>
        if (u.hostname === 'youtu.be') {
          const id = u.pathname.replace('/', '').trim();
          return id || null;
        }

        // youtube.com/watch?v=<id>
        const v = u.searchParams.get('v');
        if (v) return v;

        // youtube.com/shorts/<id>  |  youtube.com/embed/<id>
        const parts = u.pathname.split('/').filter(Boolean);
        const idx = parts.findIndex((p) => p === 'shorts' || p === 'embed');
        if (idx >= 0 && parts[idx + 1]) return parts[idx + 1];

        return null;
      } catch {
        return null;
      }
    }

    function openExternal(url) {
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    // Mobile-friendly form handling
    document.getElementById('ytForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const url = document.getElementById('url').value.trim();
      const resultDiv = document.getElementById('result');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = submitBtn.querySelector('.btn-text');
      const loading = submitBtn.querySelector('.loading');
      
      // Validate URL
      if (!url || (!url.includes('youtube.com') && !url.includes('youtu.be'))) {
        resultDiv.innerHTML = '<div class="alert alert-warning">Lütfen geçerli bir YouTube linki girin.</div>';
        return;
      }
      
      // Show loading state
      btnText.style.display = 'none';
      loading.style.display = 'inline';
      submitBtn.disabled = true;
      resultDiv.innerHTML = '';
      
      try {
        // GitHub Pages ortamında CORS nedeniyle 3. parti servisleri fetch ile çağırmak çalışmaz.
        // Çözüm: Servisleri yeni sekmede aç (navigation CORS'a takılmaz).
        const videoId = getYouTubeVideoId(url);
        const veviozUrl = `https://api.vevioz.com/api/button/mp3?url=${encodeURIComponent(url)}`;
        const ytdlUrl = `https://yt-download.org/api/button/audio?url=${encodeURIComponent(url)}`;
        const y2mateUrl = videoId ? `https://www.y2mate.com/youtube/${encodeURIComponent(videoId)}` : `https://www.y2mate.com/`;

        resultDiv.innerHTML = `
          <div class="alert alert-info text-start">
            <h6 class="mb-2">İndirme için bir servis seç</h6>
            <p class="mb-2 text-muted small">
              Not: GitHub Pages'te tarayıcıdan doğrudan API'lere istek atmak CORS yüzünden engellenir.
              Bu yüzden servisleri yeni sekmede açıyoruz.
            </p>
            <div class="d-grid gap-2">
              <button type="button" class="btn btn-success" id="openVevioz">Vevioz (MP3 buton)</button>
              <button type="button" class="btn btn-success" id="openYtdl">YT-Download (Audio buton)</button>
              <button type="button" class="btn btn-secondary" id="openY2mate">Y2Mate (web arayüz)</button>
            </div>
            <hr class="my-3">
            <div class="small text-muted">
              <div><strong>Video ID:</strong> ${videoId || 'Bulunamadı (link formatını kontrol edin)'}</div>
              <div class="mt-1"><strong>İpucu:</strong> Açılan sayfada ses formatını seçip indirmeniz gerekebilir.</div>
            </div>
          </div>
        `;

        document.getElementById('openVevioz').addEventListener('click', function() {
          openExternal(veviozUrl);
        });
        document.getElementById('openYtdl').addEventListener('click', function() {
          openExternal(ytdlUrl);
        });
        document.getElementById('openY2mate').addEventListener('click', function() {
          openExternal(y2mateUrl);
        });
        
      } catch (err) {
        console.error('Error:', err);
        resultDiv.innerHTML = `
          <div class="alert alert-danger">
            <h6>Bir Hata Oluştu</h6>
            <p>İndirme işlemi sırasında bir hata oluştu: ${err.message}</p>
            <p>Lütfen tekrar deneyin veya farklı bir video linki kullanın.</p>
          </div>
        `;
      } finally {
        // Reset button state
        btnText.style.display = 'inline';
        loading.style.display = 'none';
        submitBtn.disabled = false;
      }
    });
    
    // Add touch feedback for mobile
    document.addEventListener('touchstart', function(e) {
      if (e.target.classList.contains('btn')) {
        e.target.style.transform = 'scale(0.95)';
      }
    });
    
    document.addEventListener('touchend', function(e) {
      if (e.target.classList.contains('btn')) {
        e.target.style.transform = 'scale(1)';
      }
    });
    
    // Prevent zoom on input focus (iOS)
    document.addEventListener('touchstart', function(e) {
      if (e.target.tagName === 'INPUT') {
        e.target.style.fontSize = '16px';
      }
    });
    
    // Register service worker for PWA functionality
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        // GitHub Pages için doğru yol: /yt-vaw/sw.js veya ./sw.js
        const swPath = './sw.js';
        navigator.serviceWorker.register(swPath)
          .then(function(registration) {
            console.log('ServiceWorker registration successful with scope:', registration.scope);
            // Yeni sw.js'in daha hızlı aktif olması için güncelleme iste.
            try {
              registration.update();
            } catch (e) {
              // Sessizce geç
            }
          })
          .catch(function(err) {
            console.log('ServiceWorker registration failed:', err);
            // Hata durumunda sessizce devam et
          });
      });
    }
  </script>
</body>
</html>
