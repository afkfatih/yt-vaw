<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="YouTube videolarını WAV formatında indirin. Mobil uyumlu, hızlı ve güvenli.">
  <meta name="keywords" content="youtube, wav, indir, mp3, ses, video">
  <meta name="theme-color" content="#0d6efd">
  <title>YouTube'dan WAV İndir - GitHub Pages</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="icon-192x192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192x192.png">
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    .btn {
      -webkit-tap-highlight-color: rgba(0,0,0,0);
      touch-action: manipulation;
    }
    .form-control {
      font-size: 16px; /* Prevents zoom on iOS */
    }
    .loading {
      display: none;
    }
    .spinner-border-sm {
      width: 1rem;
      height: 1rem;
    }
    @media (max-width: 576px) {
      .container {
        padding-left: 15px;
        padding-right: 15px;
      }
      .card {
        margin: 10px;
        border-radius: 15px;
      }
      .btn {
        padding: 12px;
        font-size: 16px;
        border-radius: 10px;
      }
    }
  </style>
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title mb-4 text-center">YouTube'dan WAV İndir</h3>
            <form id="ytForm">
              <div class="mb-3">
                <label for="url" class="form-label">YouTube Linki</label>
                <input type="url" class="form-control" id="url" name="url" placeholder="https://www.youtube.com/watch?v=..." required autocomplete="off" autocapitalize="off" spellcheck="false">
              </div>
              <button type="submit" class="btn btn-primary w-100" id="submitBtn">
                <span class="btn-text">İndir</span>
                <span class="loading">
                  <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                  İşleniyor...
                </span>
              </button>
            </form>
            <div id="result" class="mt-4 text-center"></div>
          </div>
        </div>
        <p class="text-center mt-3 text-muted" style="font-size:0.9em;">Telif haklarına dikkat edin. Sadece izin verilen içerikleri indirin.</p>
      </div>
    </div>
  </div>
  <script>
    // Mobile-friendly form handling
    document.getElementById('ytForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const url = document.getElementById('url').value.trim();
      const resultDiv = document.getElementById('result');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = submitBtn.querySelector('.btn-text');
      const loading = submitBtn.querySelector('.loading');
      
      // Validate URL
      if (!url || (!url.includes('youtube.com') && !url.includes('youtu.be'))) {
        resultDiv.innerHTML = '<div class="alert alert-warning">Lütfen geçerli bir YouTube linki girin.</div>';
        return;
      }
      
      // Show loading state
      btnText.style.display = 'none';
      loading.style.display = 'inline';
      submitBtn.disabled = true;
      resultDiv.innerHTML = '';
      
      try {
        // Extract video ID from URL
        const videoIdMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/);
        const videoId = videoIdMatch ? videoIdMatch[1] : null;
        
        if (!videoId) {
          resultDiv.innerHTML = '<div class="alert alert-warning">Geçerli bir YouTube video ID\'si bulunamadı.</div>';
          return;
        }
        
        // Try multiple APIs with CORS proxy support
        const apis = [
          {
            name: 'YT-DLP API (Proxy)',
            url: `https://api.allorigins.win/get?url=${encodeURIComponent(`https://api.vevioz.com/api/button/mp3?url=${encodeURIComponent(url)}`)}`,
            useProxy: true,
            extractor: (data) => {
              try {
                const html = data.contents || data;
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                const links = Array.from(tempDiv.querySelectorAll('a')).filter(a => 
                  a.href && (a.href.includes('.mp3') || a.href.includes('.wav') || 
                  a.textContent.includes('MP3') || a.textContent.includes('WAV'))
                );
                return links.length > 0 ? links[0] : null;
              } catch (e) {
                return null;
              }
            }
          },
          {
            name: 'YT-Download API (Proxy)',
            url: `https://api.allorigins.win/get?url=${encodeURIComponent(`https://yt-download.org/api/button/audio?url=${encodeURIComponent(url)}`)}`,
            useProxy: true,
            extractor: (data) => {
              try {
                const html = data.contents || data;
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                const links = Array.from(tempDiv.querySelectorAll('a')).filter(a => 
                  a.href && (a.href.includes('.mp3') || a.href.includes('.wav') || 
                  a.textContent.includes('MP3') || a.textContent.includes('WAV'))
                );
                return links.length > 0 ? links[0] : null;
              } catch (e) {
                return null;
              }
            }
          },
          {
            name: 'Y2Mate Direct',
            url: null,
            useProxy: false,
            extractor: () => {
              return {
                href: `https://www.y2mate.com/en/search/${encodeURIComponent(url)}`,
                textContent: 'Y2Mate İndirici',
                download: false
              };
            }
          },
          {
            name: 'Direct YouTube Link',
            url: null,
            useProxy: false,
            extractor: () => {
              // Direct download link using yt-dlp compatible services
              return {
                href: `https://www.youtube.com/watch?v=${videoId}`,
                textContent: 'Video Sayfasına Git (Manuel İndirme)',
                isDirect: false
              };
            }
          }
        ];
        
        let success = false;
        let lastError = null;
        
        for (const api of apis) {
          try {
            console.log(`Trying ${api.name}...`);
            
            // If no URL, try direct extraction (for manual methods)
            if (!api.url) {
              const link = api.extractor();
              if (link && link.href) {
                resultDiv.innerHTML = `
                  <div class="alert alert-info">
                    <h6>Alternatif İndirme Yöntemi</h6>
                    <p><strong>Kaynak:</strong> ${api.name}</p>
                    <a href="${link.href}" class="btn btn-primary btn-lg mt-2" ${link.download !== false ? 'download' : ''} target="_blank">
                      ${link.textContent || 'İndirme Sayfasına Git'}
                    </a>
                    <p class="mt-2 text-muted small">Bu link sizi indirme sayfasına yönlendirecek. Oradan ses dosyasını indirebilirsiniz.</p>
                  </div>
                `;
                success = true;
                break;
              }
              continue;
            }
            
            const response = await fetch(api.url, {
              method: api.method || 'GET',
              headers: {
                'Accept': api.useProxy ? 'application/json' : 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                ...api.headers
              },
              body: api.body,
              mode: 'cors',
              credentials: 'omit'
            });
            
            if (response.ok) {
              let data;
              if (api.useProxy) {
                const jsonData = await response.json();
                data = jsonData.contents || jsonData;
              } else {
                data = await response.text();
              }
              
              const link = api.extractor(data);
              
              if (link && link.href) {
                resultDiv.innerHTML = `
                  <div class="alert alert-success">
                    <h6>İndirme Hazır!</h6>
                    <p><strong>Kaynak:</strong> ${api.name}</p>
                    <a href="${link.href}" class="btn btn-success btn-lg mt-2" ${link.download !== false ? 'download' : ''} target="_blank">
                      <i class="bi bi-download"></i> ${link.textContent || 'WAV/MP3 Dosyasını İndir'}
                    </a>
                    <p class="mt-2 text-muted small">Not: İndirme başlamazsa, linke sağ tıklayıp "Farklı kaydet" seçeneğini kullanın.</p>
                  </div>
                `;
                success = true;
                break;
              }
            } else {
              lastError = `HTTP ${response.status}: ${response.statusText}`;
            }
          } catch (apiError) {
            console.log(`${api.name} error:`, apiError);
            // CORS hatası için özel mesaj
            if (apiError.message.includes('CORS') || apiError.message.includes('Failed to fetch')) {
              lastError = `${api.name}: CORS hatası - API tarayıcıdan erişime izin vermiyor`;
            } else if (apiError.message.includes('ERR_NAME_NOT_RESOLVED')) {
              lastError = `${api.name}: Sunucu bulunamadı`;
            } else {
              lastError = `${api.name}: ${apiError.message}`;
            }
            continue;
          }
        }
        
        if (!success) {
          const isCorsError = lastError && lastError.includes('CORS');
          const videoIdMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/);
          const videoId = videoIdMatch ? videoIdMatch[1] : null;
          
          resultDiv.innerHTML = `
            <div class="alert alert-warning">
              <h6>Otomatik İndirme Başarısız</h6>
              ${isCorsError ? `
                <p><strong>CORS Hatası:</strong> Harici API'ler tarayıcıdan doğrudan erişime izin vermiyor.</p>
                <p class="text-muted small">Alternatif çözümler:</p>
                <ul class="text-start">
                  <li><strong>Manuel İndirme:</strong> Aşağıdaki linklerden birini kullanın</li>
                  <li><strong>yt-dlp:</strong> Komut satırından: <code>yt-dlp -x --audio-format wav "${url}"</code></li>
                  <li><strong>Browser Extension:</strong> Video DownloadHelper veya benzeri eklentiler</li>
                </ul>
              ` : `
                <p>Bu video için otomatik indirme bulunamadı. Lütfen:</p>
                <ul class="text-start">
                  <li>Video linkinin doğru olduğundan emin olun</li>
                  <li>Video'nun herkese açık olduğunu kontrol edin</li>
                  <li>Video'nun telif hakkı korumalı olmadığını kontrol edin</li>
                  <li>Birkaç dakika sonra tekrar deneyin</li>
                </ul>
              `}
              ${videoId ? `
                <div class="mt-3">
                  <p><strong>Manuel İndirme Linkleri:</strong></p>
                  <div class="d-grid gap-2">
                    <a href="https://www.youtube.com/watch?v=${videoId}" class="btn btn-outline-primary btn-sm" target="_blank">YouTube Video Sayfası</a>
                    <a href="https://loader.to/en20/youtube-video-downloader/?url=${encodeURIComponent(url)}" class="btn btn-outline-secondary btn-sm" target="_blank">Loader.to İndirici</a>
                    <a href="https://en.savefrom.net/#url=${encodeURIComponent(url)}" class="btn btn-outline-secondary btn-sm" target="_blank">SaveFrom.net İndirici</a>
                  </div>
                </div>
              ` : ''}
              <p class="mt-2 text-muted small"><strong>Teknik Detay:</strong> ${lastError || 'Bilinmeyen hata'}</p>
            </div>
          `;
        }
        
      } catch (err) {
        console.error('Error:', err);
        resultDiv.innerHTML = `
          <div class="alert alert-danger">
            <h6>Bir Hata Oluştu</h6>
            <p>İndirme işlemi sırasında bir hata oluştu: ${err.message}</p>
            <p>Lütfen tekrar deneyin veya farklı bir video linki kullanın.</p>
          </div>
        `;
      } finally {
        // Reset button state
        btnText.style.display = 'inline';
        loading.style.display = 'none';
        submitBtn.disabled = false;
      }
    });
    
    // Add touch feedback for mobile
    document.addEventListener('touchstart', function(e) {
      if (e.target.classList.contains('btn')) {
        e.target.style.transform = 'scale(0.95)';
      }
    });
    
    document.addEventListener('touchend', function(e) {
      if (e.target.classList.contains('btn')) {
        e.target.style.transform = 'scale(1)';
      }
    });
    
    // Prevent zoom on input focus (iOS)
    document.addEventListener('touchstart', function(e) {
      if (e.target.tagName === 'INPUT') {
        e.target.style.fontSize = '16px';
      }
    });
    
    // Register service worker for PWA functionality
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        // GitHub Pages için doğru yol: /yt-vaw/sw.js veya ./sw.js
        const swPath = './sw.js';
        navigator.serviceWorker.register(swPath)
          .then(function(registration) {
            console.log('ServiceWorker registration successful with scope:', registration.scope);
          })
          .catch(function(err) {
            console.log('ServiceWorker registration failed:', err);
            // Hata durumunda sessizce devam et
          });
      });
    }
  </script>
</body>
</html>
